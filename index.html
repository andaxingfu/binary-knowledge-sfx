<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>二进制 · 惊异之学</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23070809'/%3E%3Ccircle cx='8' cy='8' r='2' fill='%23c9a86a'/%3E%3C/svg%3E" />
<style>
  :root {
    --bg: #070809;
    --fg: #e8e4d9;
    --muted: #8a8680;
    --gold: #c9a86a;
    --gold-soft: rgba(201, 168, 106, 0.55);
    --accent: #6ec8d4;
    --accent-dim: rgba(110, 200, 212, 0.35);
    --danger: #c45c5c;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", "STSong", "SimSun", Georgia, serif;
    --sans: "PingFang SC", "Noto Sans SC", "Helvetica Neue", Arial, sans-serif;
    --mono: "SF Mono", "JetBrains Mono", "Menlo", "Consolas", monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--sans);
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  #stage {
    position: relative;
    width: 100%; height: 100%;
    background:
      radial-gradient(ellipse 80% 50% at 50% 40%, rgba(30, 34, 40, 0.55), transparent 70%),
      var(--bg);
  }
  #grain {
    position: absolute; inset: 0; pointer-events: none; opacity: 0.07; z-index: 50;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  }
  #canvas {
    position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1;
  }
  #ui {
    position: absolute; inset: 0; z-index: 10;
    display: flex; flex-direction: column;
    pointer-events: none;
  }
  #chapter {
    position: absolute; top: 28px; left: 32px;
    font-size: 12px; letter-spacing: 0.18em;
    color: var(--muted); text-transform: uppercase;
    font-family: var(--sans);
    opacity: 0; transition: opacity 0.6s ease;
  }
  #chapter.visible { opacity: 1; }
  #chapter .en { opacity: 0.55; margin-left: 8px; letter-spacing: 0.12em; font-size: 11px; }

  #center {
    flex: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 80px 24px 120px;
    gap: 18px;
  }
  .line-cn {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(28px, 5.2vw, 56px);
    letter-spacing: 0.08em;
    line-height: 1.35;
    color: var(--fg);
    opacity: 0;
    transform: translateY(8px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .line-cn.show { opacity: 1; transform: none; }
  .line-en {
    font-family: var(--sans);
    font-size: clamp(12px, 1.4vw, 15px);
    letter-spacing: 0.14em;
    color: var(--muted);
    opacity: 0;
    transition: opacity 0.8s ease 0.15s;
    max-width: 42em;
  }
  .line-en.show { opacity: 0.85; }
  .gold { color: var(--gold); }
  .accent { color: var(--accent); }
  .cursor {
    display: inline-block;
    width: 2px; height: 0.9em;
    background: var(--gold);
    margin-left: 4px;
    vertical-align: -0.08em;
    box-shadow: 0 0 12px var(--gold-soft);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink {
    0%, 49% { opacity: 1; }
    50%, 100% { opacity: 0; }
  }
  .eq-card {
    margin-top: 28px;
    padding: 22px 36px;
    border: 1px solid rgba(201, 168, 106, 0.28);
    background: rgba(12, 12, 14, 0.65);
    backdrop-filter: blur(6px);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.06em;
    color: var(--gold);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 0.7s ease, transform 0.7s ease;
  }
  .eq-card.show { opacity: 1; transform: none; }
  .quote-card {
    margin-top: 20px;
    max-width: 28em;
    font-family: var(--serif);
    font-size: clamp(16px, 2vw, 22px);
    color: var(--fg);
    opacity: 0.92;
    line-height: 1.6;
    letter-spacing: 0.06em;
  }
  .sub-caption {
    position: absolute; bottom: 96px; left: 0; right: 0;
    text-align: center;
    font-size: clamp(13px, 1.5vw, 16px);
    color: var(--muted);
    letter-spacing: 0.12em;
    padding: 0 24px;
    opacity: 0;
    transition: opacity 0.7s ease;
  }
  .sub-caption.show { opacity: 1; }
  .sub-caption .en {
    display: block; margin-top: 6px;
    font-size: 0.85em; opacity: 0.7; letter-spacing: 0.1em;
  }

  /* Cover */
  #cover {
    position: absolute; inset: 0; z-index: 40;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: var(--bg);
    cursor: pointer;
    transition: opacity 0.9s ease;
  }
  #cover.hide { opacity: 0; pointer-events: none; }
  #cover .title {
    font-family: var(--serif);
    font-size: clamp(40px, 7vw, 72px);
    letter-spacing: 0.2em;
    margin-bottom: 12px;
  }
  #cover .subtitle {
    color: var(--gold);
    font-family: var(--serif);
    font-size: clamp(16px, 2.2vw, 22px);
    letter-spacing: 0.28em;
    margin-bottom: 8px;
  }
  #cover .en {
    color: var(--muted);
    font-size: 12px;
    letter-spacing: 0.22em;
    margin-bottom: 48px;
  }
  #cover .hint {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.18em;
    opacity: 0.7;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.4; }
    50% { opacity: 0.9; }
  }
  #cover .hline {
    width: min(280px, 50vw); height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    margin: 28px 0;
    position: relative;
  }
  #cover .hline::after {
    content: "";
    position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; border-radius: 50%;
    background: #fff;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 16px rgba(255,255,255,0.8);
  }

  /* Controls */
  #controls {
    position: absolute; bottom: 0; left: 0; right: 0; z-index: 30;
    padding: 16px 24px 20px;
    background: linear-gradient(transparent, rgba(0,0,0,0.75));
    display: flex; align-items: center; gap: 14px;
    pointer-events: auto;
    opacity: 0; transition: opacity 0.5s;
  }
  #controls.visible { opacity: 1; }
  #controls.idle { opacity: 0; }
  button.ctrl {
    background: transparent; border: 1px solid rgba(232,228,217,0.25);
    color: var(--fg); width: 40px; height: 40px; border-radius: 50%;
    cursor: pointer; font-size: 14px;
    display: flex; align-items: center; justify-content: center;
    transition: border-color 0.2s, background 0.2s;
  }
  button.ctrl:hover { border-color: var(--gold); background: rgba(201,168,106,0.08); }
  #progress-wrap {
    flex: 1; height: 3px; background: rgba(255,255,255,0.12);
    border-radius: 2px; cursor: pointer; position: relative;
  }
  #progress {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, var(--gold), var(--accent));
    border-radius: 2px;
    transition: width 0.08s linear;
  }
  #time-label {
    font-family: var(--mono); font-size: 11px;
    color: var(--muted); min-width: 72px; text-align: right;
    letter-spacing: 0.05em;
  }

  /* Interactive bits in Act1 */
  #bit-row {
    display: flex; gap: 18px; margin-top: 36px;
    opacity: 0; transition: opacity 0.7s;
    pointer-events: auto;
  }
  #bit-row.show { opacity: 1; }
  .bit {
    width: 56px; height: 56px;
    border: 1px solid rgba(232,228,217,0.25);
    border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 22px;
    color: var(--muted);
    cursor: pointer;
    transition: all 0.35s ease;
    user-select: none;
  }
  .bit.on {
    border-color: var(--gold);
    color: var(--gold);
    box-shadow: 0 0 20px var(--gold-soft), inset 0 0 18px rgba(201,168,106,0.12);
  }
  .bit-label {
    margin-top: 14px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--accent);
    letter-spacing: 0.2em;
    opacity: 0;
    transition: opacity 0.5s;
  }
  .bit-label.show { opacity: 1; }

  #endcard {
    position: absolute; inset: 0; z-index: 35;
    display: none; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(7,8,9,0.92);
    gap: 20px;
  }
  #endcard.show { display: flex; }
  #endcard .t {
    font-family: var(--serif);
    font-size: clamp(24px, 4vw, 36px);
    letter-spacing: 0.16em;
  }
  #endcard .replay {
    margin-top: 24px;
    pointer-events: auto;
    background: transparent;
    border: 1px solid var(--gold-soft);
    color: var(--gold);
    padding: 12px 28px;
    font-size: 13px;
    letter-spacing: 0.2em;
    cursor: pointer;
    font-family: var(--sans);
  }
  #endcard .replay:hover { background: rgba(201,168,106,0.1); }

  .muted { color: var(--muted); }
  .tiny { font-size: 0.55em; letter-spacing: 0.12em; opacity: 0.7; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="canvas"></canvas>
  <div id="grain"></div>

  <div id="ui">
    <div id="chapter"></div>
    <div id="center">
      <div id="main-cn" class="line-cn"></div>
      <div id="main-en" class="line-en"></div>
      <div id="eq" class="eq-card"></div>
      <div id="bit-row"></div>
      <div id="bit-label" class="bit-label"></div>
    </div>
    <div id="sub" class="sub-caption"></div>
  </div>

  <div id="cover">
    <div class="title">二进制</div>
    <div class="hline"></div>
    <div class="subtitle">惊异之学</div>
    <div class="en">BINARY · THE LANGUAGE OF TWO</div>
    <div class="hint">轻触开始 · TAP TO BEGIN</div>
  </div>

  <div id="controls">
    <button class="ctrl" id="btn-play" title="播放/暂停" aria-label="play">▶</button>
    <button class="ctrl" id="btn-replay" title="重播" aria-label="replay">↺</button>
    <div id="progress-wrap"><div id="progress"></div></div>
    <div id="time-label">0:00 / 0:00</div>
  </div>

  <div id="endcard">
    <div class="t">这一次，由你来填。</div>
    <div class="line-en show" style="opacity:0.7">This time, the blank is yours.</div>
    <button class="replay" id="btn-end-replay">重新开始 · REPLAY</button>
  </div>
</div>

<script>
(() => {
  "use strict";

  // ─── Timeline (seconds) ───────────────────────────────────────────
  // Total ~ 3:40
  const TOTAL = 220;

  const beats = [
    // HOOK 0–28

    { t: 3.2,  act: "hook",
      cn: "亮。", en: "On.", speak: "下一秒呢？", audio: "audio/n25.mp3", audio: "audio/n02.mp3", scene: "hook_blank",

    { t: 7.5,  act: "hook",

    { t: 12.5, act: "hook",
      cn: "只有两种可能。", en: "Only two possibilities.",

    { t: 19.0, act: "hook",

    // ACT 1 28–62
    { t: 28.0, act: "1", chapter: "01 基本单元  THE BIT",
      cn: "一盏灯。", en: "A single lamp.",

      speak: "一七零三年，莱布尼茨写下：一切都可以用零与一表示。", audio: "audio/n13.mp3", scene: "leibniz",
      sub: "一切，都可以用零与一表示。<span class='en'>Everything, from zero and one.</span>" },

    // ACT 3 100–140
    { t: 100.0, act: "3", chapter: "03 摩擦  FRICTION",
      cn: "人们以为：那只是计算机的事。", en: "People think: that's only for computers.",

    { t: 108.0, act: "3",
      cn: "可噪声，不认这个边界。", en: "Noise does not respect that border.",
      speak: "可噪声，不认这个边界。一位翻转，意义就变了。", audio: "audio/n15.mp3", scene: "noise",

  // ─── DOM ──────────────────────────────────────────────────────────
  const $ = (id) => document.getElementById(id);
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const chapterEl = $("chapter");

  // ─── State ────────────────────────────────────────────────────────

  let started = false;
  let t0 = 0;          // performance.now when play started (adjusted)
  let elapsed = 0;     // current film time in seconds
  let lastBeatIdx = -1;
  let spokenIdx = -1;
  let scene = "idle";
  let particles = [];
  let lampOn = true;
  let bitStates = [0, 0, 0, 0];
  let noiseFlip = 0;
  let idleTimer = null;
  let audioCtx = null;
  let ambientNodes = null;

  // ─── Procedural vibe BGM (Web Audio; MP3 optional debug) ──────────

  const USE_MP3_BGM = false; // debug: true → audio/bgm.mp3 instead of synth
  const BGM_BPM = 113;
  const BGM_BEAT = 60 / BGM_BPM;           // ≈0.531s
  const BGM_LOOP_BEATS = 16;               // 16 beats ≈ 8.495s
  const BGM_VOL = 0.32;
  const BGM_DUCK = 0.12;
  const BGM_FADE = 0.55;
  // Chord cells (Hz): Eb · F · Fm · Fm — sparse cinematic pads
  const BGM_CHORDS = [
    [155.56, 196.00, 233.08], // Eb
    [174.61, 220.00, 261.63], // F
    [174.61, 207.65, 261.63], // Fm
    [174.61, 207.65, 261.63]  // Fm
  ];
  const BGM_F2 = 87.31;
  const BGM_F1 = 43.65;

  let bgm = null;              // HTMLAudioElement only if USE_MP3_BGM
  let bgmGraph = null;         // Web Audio graph
  let bgmRunning = false;
  let bgmFadeToken = 0;
  let bgmDuckTimer = null;
  let bgmSchedTimer = null;
  let bgmNextBeatTime = 0;
  let bgmBeatIndex = 0;
  let bgmTargetVol = BGM_VOL;

  function ensureBgmGraph() {
    const ac = ensureAudio();
    if (bgmGraph) return bgmGraph;
    const master = ac.createGain();
    master.gain.value = 0;
    master.connect(ac.destination);

    // Pinned bass on F (pedal)
    const bass = ac.createOscillator();
    bass.type = "sine";
    bass.frequency.value = BGM_F2;
    const bassLp = ac.createBiquadFilter();
    bassLp.type = "lowpass";
    bassLp.frequency.value = 260;
    bassLp.Q.value = 0.7;
    const bassG = ac.createGain();
    bassG.gain.value = 0.55;
    bass.connect(bassLp); bassLp.connect(bassG); bassG.connect(master);

    const sub = ac.createOscillator();
    sub.type = "sine";
    sub.frequency.value = BGM_F1;
    const subG = ac.createGain();
    subG.gain.value = 0.32;
    sub.connect(subG); subG.connect(master);

    bass.start();
    sub.start();
    bgmGraph = { master, bass, sub, bassG, subG };
    return bgmGraph;
  }

  function scheduleSoftPulse(ac, master, t) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    const f = ac.createBiquadFilter();
    o.type = "sine";
    o.frequency.value = 98;
    f.type = "lowpass";
    f.frequency.value = 180;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.09, t + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);
    o.connect(f); f.connect(g); g.connect(master);
    o.start(t);
    o.stop(t + 0.32);
  }

  function scheduleChordPad(ac, master, t, freqs) {
    const dur = BGM_BEAT * 4 * 0.92;
    freqs.forEach(function (hz, i) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      const f = ac.createBiquadFilter();
      o.type = i === 0 ? "triangle" : "sine";
      o.frequency.value = hz;
      f.type = "lowpass";
      f.frequency.value = 900;
      const peak = 0.065 - i * 0.012;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.004, peak), t + 0.35);
      g.gain.setValueAtTime(Math.max(0.004, peak * 0.85), t + dur * 0.55);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(f); f.connect(g); g.connect(master);
      o.start(t);
      o.stop(t + dur + 0.05);
    });
  }

  function scheduleBeat(t, beatIdx) {
    if (!bgmGraph || !audioCtx) return;
    const ac = audioCtx;
    const master = bgmGraph.master;
    scheduleSoftPulse(ac, master, t);
    if (beatIdx % 4 === 0) {
      const chord = BGM_CHORDS[Math.floor(beatIdx / 4) % BGM_CHORDS.length];
      scheduleChordPad(ac, master, t, chord);
    }
  }

  function bgmSchedulerTick() {
    if (!bgmRunning || !audioCtx || !bgmGraph) return;
    const ac = audioCtx;
    const horizon = ac.currentTime + 1.25;
    while (bgmNextBeatTime < horizon) {
      scheduleBeat(bgmNextBeatTime, bgmBeatIndex);
      bgmNextBeatTime += BGM_BEAT;
      bgmBeatIndex = (bgmBeatIndex + 1) % BGM_LOOP_BEATS;
    }
  }

  function ensureMp3Bgm() {
    if (bgm) return bgm;
    bgm = new Audio("audio/bgm.mp3");
    bgm.loop = true;
    bgm.preload = "auto";
    bgm.volume = 0;
    return bgm;
  }

  function fadeBgmTo(target, seconds) {
    bgmTargetVol = target;
    const dur = Math.max(0.05, seconds == null ? BGM_FADE : seconds);
    if (USE_MP3_BGM) {
      const a = ensureMp3Bgm();
      const startVol = a.volume;
      const ms = dur * 1000;
      const tStart = performance.now();
      const token = ++bgmFadeToken;
      function step(now) {
        if (token !== bgmFadeToken) return;
        const p = Math.min(1, (now - tStart) / ms);
        a.volume = startVol + (target - startVol) * p;
        if (p < 1) requestAnimationFrame(step);
      }
      requestAnimationFrame(step);
      return;
    }
    const g = ensureBgmGraph().master.gain;
    const ac = audioCtx;
    const token = ++bgmFadeToken;
    const now = ac.currentTime;
    g.cancelScheduledValues(now);
    g.setValueAtTime(g.value, now);
    g.linearRampToValueAtTime(target, now + dur);
    // token kept so overlapping fades invalidate older pause/stop timers
    void token;
  }

  function startBgm() {
    if (USE_MP3_BGM) {
      const a = ensureMp3Bgm();
      const p = a.play();
      if (p && p.catch) p.catch(function () {});
      fadeBgmTo(BGM_VOL, BGM_FADE);
      return;
    }
    unlockAudio().then(function () {
      ensureBgmGraph();
      if (!bgmRunning) {
        bgmRunning = true;
        // Resume from next beat; phase reset only via resetBgmPhase / stopBgm(true)
        if (!bgmNextBeatTime || bgmNextBeatTime < audioCtx.currentTime) {
          bgmNextBeatTime = audioCtx.currentTime + 0.06;
        }
        bgmSchedulerTick();
        if (bgmSchedTimer) clearInterval(bgmSchedTimer);
        bgmSchedTimer = setInterval(bgmSchedulerTick, 100);
      }
      fadeBgmTo(BGM_VOL, BGM_FADE);
    });
  }

  function pauseBgm() {
    fadeBgmTo(0, 0.35);
    const token = bgmFadeToken;
    setTimeout(function () {
      if (token !== bgmFadeToken) return;
      if (playing) return;
      if (USE_MP3_BGM) {
        if (bgm) { try { bgm.pause(); } catch (_) {} }
        return;
      }
      bgmRunning = false;
      if (bgmSchedTimer) { clearInterval(bgmSchedTimer); bgmSchedTimer = null; }
    }, 400);
  }

  function stopBgm(reset) {
    fadeBgmTo(0, BGM_FADE);
    const token = bgmFadeToken;
    setTimeout(function () {
      if (token !== bgmFadeToken) return;
      if (USE_MP3_BGM) {
        try {
          if (bgm) {
            bgm.pause();
            if (reset) bgm.currentTime = 0;
          }
        } catch (_) {}
        return;
      }
      bgmRunning = false;
      if (bgmSchedTimer) { clearInterval(bgmSchedTimer); bgmSchedTimer = null; }
      if (reset) {
        bgmBeatIndex = 0;
        if (audioCtx) bgmNextBeatTime = audioCtx.currentTime + 0.06;
      }
    }, Math.floor(BGM_FADE * 1000) + 50);
  }

  function duckBgm(on) {
    if (USE_MP3_BGM) {
      if (!bgm && !bgmGraph) return;
    } else if (!bgmGraph) {
      return;
    }
    if (bgmDuckTimer) { clearTimeout(bgmDuckTimer); bgmDuckTimer = null; }
    if (on) fadeBgmTo(BGM_DUCK, 0.25);
    else fadeBgmTo(BGM_VOL, 0.45);
  }

  function resetBgmPhase() {
    if (USE_MP3_BGM) {
      if (bgm) { try { bgm.currentTime = 0; } catch (_) {} }
      return;
    }
    bgmBeatIndex = 0;
    if (audioCtx && bgmRunning) {
      bgmNextBeatTime = audioCtx.currentTime + 0.05;
    }
  }

  // ─── Audio (ambient + SFX via Web Audio) ──────────────────────────
  function ensureAudio() {
    if (audioCtx) return audioCtx;
    const AC = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AC();
    return audioCtx;
  }

  // Browsers require a user gesture + resolved resume() before oscillators are audible.
  let audioUnlockPromise = null;
  function unlockAudio() {
    const ac = ensureAudio();
    if (ac.state === "running") {
      return Promise.resolve(ac);
    }
    // Re-resume whenever suspended (iOS may re-suspend); coalesce in-flight resumes.
    if (audioUnlockPromise) return audioUnlockPromise;
    audioUnlockPromise = Promise.resolve()
      .then(function () {
        if (ac.state === "suspended") return ac.resume();
      })
      .then(function () {
        if (ac.state === "suspended") return ac.resume();
      })
      .then(function () { return ac; })
      .catch(function () { return ac; })
      .then(function (ctx) {
        audioUnlockPromise = null;
        return ctx;
      });
    return audioUnlockPromise;
  }

  function startAmbient() {
    const ac = ensureAudio();
    if (ambientNodes) return;
    const master = ac.createGain();
    master.gain.value = 0.07;
    master.connect(ac.destination);

    // soft low drone
    const osc1 = ac.createOscillator();
    osc1.type = "sine";
    osc1.frequency.value = 55;
    const g1 = ac.createGain();
    g1.gain.value = 0.6;
    osc1.connect(g1); g1.connect(master);

    const osc2 = ac.createOscillator();
    osc2.type = "sine";
    osc2.frequency.value = 82.5;
    const g2 = ac.createGain();
    g2.gain.value = 0.25;
    osc2.connect(g2); g2.connect(master);

    // gentle noise bed
    const bufLen = ac.sampleRate * 2;
    const buf = ac.createBuffer(1, bufLen, ac.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufLen; i++) data[i] = (Math.random() * 2 - 1) * 0.15;
    const noise = ac.createBufferSource();
    noise.buffer = buf;
    noise.loop = true;
    const ng = ac.createGain();
    ng.gain.value = 0.08;
    const filter = ac.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = 400;
    noise.connect(filter); filter.connect(ng); ng.connect(master);

    osc1.start(); osc2.start(); noise.start();
    ambientNodes = { master, osc1, osc2, noise, g1, g2, ng };
  }

  function stopAmbient() {
    if (!ambientNodes || !audioCtx) return;
    try {
      ambientNodes.osc1.stop();
      ambientNodes.osc2.stop();
      ambientNodes.noise.stop();
    } catch (_) {}
    ambientNodes = null;
  }

  function sfxClick() {
    unlockAudio().then(function (ac) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "sine";
      o.frequency.value = 880;
      g.gain.setValueAtTime(0.18, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.09);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.1);
    });
  }

  function sfxBass() {
    unlockAudio().then(function (ac) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "sine";
      o.frequency.setValueAtTime(90, ac.currentTime);
      o.frequency.exponentialRampToValueAtTime(40, ac.currentTime + 0.35);
      g.gain.setValueAtTime(0.30, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.4);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.42);
    });
  }

  function sfxType() {
    unlockAudio().then(function (ac) {
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = "square";
      o.frequency.value = 1200 + Math.random() * 400;
      g.gain.setValueAtTime(0.07, ac.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.04);
      o.connect(g); g.connect(ac.destination);
      o.start(); o.stop(ac.currentTime + 0.05);
    });
  }

  // ─── Narration (disabled: SFX + synth BGM only) ───────────────────
  const ENABLE_NARRATION = false; // set true to restore baked MP3 / Web Speech VO
  let narrAudio = null;
  let uttering = null;

  function stopSpeak() {
    if (narrAudio) {
      try { narrAudio.pause(); narrAudio.currentTime = 0; } catch (_) {}
      narrAudio = null;
    }
    try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch (_) {}
    uttering = null;
    if (playing) duckBgm(false);
  }

  function speakFallbackTTS(text) {
    if (!ENABLE_NARRATION) return;
    if (!text || !window.speechSynthesis) return;
    try { window.speechSynthesis.cancel(); } catch (_) {}
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "zh-CN";
    u.rate = 0.88;
    u.pitch = 0.95;
    u.volume = 1;
    const voices = window.speechSynthesis.getVoices();
    const zh = voices.find(v => /zh(-|_)?CN|Chinese|普通话|国语/i.test(v.lang + v.name));
    if (zh) u.voice = zh;
    uttering = u;
    u.onend = function () { duckBgm(false); };
    u.onerror = function () { duckBgm(false); };
    window.speechSynthesis.speak(u);
  }

  function speak(text, audioSrc) {
    if (!ENABLE_NARRATION) return; // no VO load/play; keep SFX + synth bed
    stopSpeak();
    duckBgm(true);
    if (audioSrc) {
      const a = new Audio(audioSrc);
      a.preload = "auto";
      narrAudio = a;
      a.onended = function () { duckBgm(false); };
      const p = a.play();
      if (p && p.catch) {
        p.catch(() => speakFallbackTTS(text));
      }
      a.onerror = () => speakFallbackTTS(text);
      return;
    }
    speakFallbackTTS(text);
  }

  if (ENABLE_NARRATION && window.speechSynthesis) {
    window.speechSynthesis.getVoices();
    window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
  }

  // ─── Scene drawing helpers ────────────────────────────────────────
  function clearScene() {
    ctx.clearRect(0, 0, W, H);
  }

  function drawHorizon(y, color, glow) {
    const mid = W / 2;
    ctx.save();
    if (glow) {
      ctx.strokeStyle = glow;
      ctx.lineWidth = 3;
      ctx.globalAlpha = 0.25;
      ctx.beginPath();
      ctx.moveTo(mid - 180, y);
      ctx.lineTo(mid + 180, y);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.strokeStyle = color || "rgba(110,200,212,0.55)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(mid - 160, y);
    ctx.lineTo(mid + 160, y);
    ctx.stroke();
    // center spark
    ctx.fillStyle = "#fff";
    ctx.beginPath();
    ctx.arc(mid, y, 2.2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawLamp(on, pulse) {
    const cx = W / 2, cy = H * 0.42;
    ctx.save();
    // glow
    if (on) {
      const g = ctx.createRadialGradient(cx, cy, 4, cx, cy, 90 + pulse * 20);
      g.addColorStop(0, "rgba(201,168,106,0.45)");
      g.addColorStop(1, "rgba(201,168,106,0)");
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, 90 + pulse * 20, 0, Math.PI * 2);
      ctx.fill();
    }
    // bulb circle
    ctx.strokeStyle = on ? "#c9a86a" : "rgba(232,228,217,0.3)";
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, 28, 0, Math.PI * 2);
    ctx.stroke();
    if (on) {
      ctx.fillStyle = "rgba(201,168,106,0.15)";
      ctx.fill();
    }
    // filament
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + 4);
    ctx.quadraticCurveTo(cx, cy - 10, cx + 8, cy + 4);
    ctx.strokeStyle = on ? "#e8e4d9" : "rgba(232,228,217,0.2)";
    ctx.stroke();
    // base
    ctx.beginPath();
    ctx.moveTo(cx - 12, cy + 28);
    ctx.lineTo(cx - 10, cy + 42);
    ctx.lineTo(cx + 10, cy + 42);
    ctx.lineTo(cx + 12, cy + 28);
    ctx.strokeStyle = "rgba(232,228,217,0.35)";
    ctx.stroke();
    ctx.restore();
  }

  function drawPowerTicks(progress) {
    const labels = ["2⁰","2¹","2²","2³","2⁴","2⁵","2⁶","2⁷"];
    const n = labels.length;
    const y = H * 0.48;
    const span = Math.min(W * 0.7, 520);
    const x0 = W / 2 - span / 2;
    ctx.save();
    ctx.strokeStyle = "rgba(110,200,212,0.4)";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x0, y);
    ctx.lineTo(x0 + span * Math.min(1, progress), y);
    ctx.stroke();
    for (let i = 0; i < n; i++) {
      const p = i / (n - 1);
      if (p > progress) break;
      const x = x0 + span * p;
      ctx.beginPath();
      ctx.moveTo(x, y - 6);
      ctx.lineTo(x, y + 6);
      ctx.strokeStyle = "rgba(201,168,106,0.7)";
      ctx.stroke();
      ctx.fillStyle = "rgba(201,168,106,0.85)";
      ctx.font = "12px SF Mono, Menlo, monospace";
      ctx.textAlign = "center";
      ctx.fillText(labels[n - 1 - i], x, y + 22);
    }
    ctx.restore();
  }

  function drawBinaryBar(bits, highlightIdx, flipped) {
    const y = H * 0.55;
    const n = bits.length;
    const gap = 36;
    const total = (n - 1) * gap;
    const x0 = W / 2 - total / 2;
    ctx.save();
    ctx.font = "28px SF Mono, Menlo, monospace";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    for (let i = 0; i < n; i++) {
      const x = x0 + i * gap;
      const isHi = i === highlightIdx;
      const val = (flipped && i === highlightIdx) ? (1 - bits[i]) : bits[i];
      ctx.fillStyle = isHi ? "#c9a86a" : (val ? "#e8e4d9" : "rgba(232,228,217,0.35)");
      if (isHi) {
        ctx.shadowColor = "rgba(201,168,106,0.6)";
        ctx.shadowBlur = 16;
      } else {
        ctx.shadowBlur = 0;
      }
      ctx.fillText(String(val), x, y);
    }
    ctx.restore();
  }

  function drawStars(count, seed) {
    ctx.save();
    for (let i = 0; i < count; i++) {
      const x = ((Math.sin(seed + i * 12.9898) * 43758.5453) % 1 + 1) % 1 * W;
      const y = ((Math.sin(seed + i * 78.233) * 24634.145) % 1 + 1) % 1 * H;
      const a = 0.15 + (((Math.sin(seed * 0.5 + i) + 1) / 2) * 0.5);
      const r = (i % 5 === 0) ? 1.4 : 0.7;
      ctx.fillStyle = i % 7 === 0 ? `rgba(201,168,106,${a})` :
                      i % 11 === 0 ? `rgba(110,200,212,${a})` :
                      `rgba(232,228,217,${a})`;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }

  function drawVoyager(t) {
    drawStars(80, t * 0.02);
    const cx = W * 0.62, cy = H * 0.38;
    ctx.save();
    // signal dots from left
    const sx = W * 0.22, sy = H * 0.42;
    for (let i = 0; i < 12; i++) {
      const p = (i / 12 + t * 0.08) % 1;
      const x = sx + (cx - sx) * p;
      const y = sy + (cy - sy) * p + Math.sin(p * 6 + t) * 4;
      ctx.globalAlpha = 0.2 + p * 0.6;
      ctx.fillStyle = "#c9a86a";
      ctx.beginPath();
      ctx.arc(x, y, 1.5 + p, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    // dish
    ctx.strokeStyle = "rgba(110,200,212,0.7)";
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.ellipse(cx, cy, 36, 14, -0.4, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(cx - 8, cy + 6);
    ctx.lineTo(cx - 18, cy + 40);
    ctx.lineTo(cx + 10, cy + 36);
    ctx.stroke();
    // boom
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + 42, cy - 28);
    ctx.stroke();
    ctx.fillStyle = "#c9a86a";
    ctx.beginPath();
    ctx.arc(cx + 42, cy - 28, 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawDNA(t) {
    const cx = W / 2;
    const y0 = H * 0.32;
    const h = H * 0.28;
    ctx.save();
    ctx.lineWidth = 1.2;
    for (let i = 0; i < 40; i++) {
      const p = i / 39;
      const y = y0 + h * p;
      const phase = p * Math.PI * 4 + t * 0.6;
      const x1 = cx + Math.sin(phase) * 40;
      const x2 = cx + Math.sin(phase + Math.PI) * 40;
      ctx.strokeStyle = i % 2 ? "rgba(201,168,106,0.55)" : "rgba(110,200,212,0.55)";
      ctx.beginPath();
      ctx.moveTo(x1, y);
      ctx.lineTo(x2, y);
      ctx.stroke();
      ctx.fillStyle = "#e8e4d9";
      ctx.beginPath(); ctx.arc(x1, y, 2, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x2, y, 2, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawNoiseGlitch(t) {
    ctx.save();
    for (let i = 0; i < 8; i++) {
      const y = H * 0.3 + ((t * 40 + i * 37) % (H * 0.4));
      ctx.fillStyle = `rgba(196,92,92,${0.04 + (i % 3) * 0.02})`;
      ctx.fillRect(W * 0.25, y, W * 0.5, 2 + (i % 2));
    }
    ctx.restore();
  }

  function drawCursorBlank(t) {
    const cx = W / 2, cy = H * 0.42;
    const on = (Math.floor(t * 2) % 2) === 0;
    ctx.save();
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, 40);
    g.addColorStop(0, "rgba(201,168,106,0.2)");
    g.addColorStop(1, "rgba(201,168,106,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, 40, 0, Math.PI * 2);
    ctx.fill();
    if (on) {
      ctx.fillStyle = "#c9a86a";
      ctx.fillRect(cx - 1, cy - 18, 2, 36);
    }
    ctx.restore();
  }

  // ─── UI text updates ──────────────────────────────────────────────
  function setText(cn, en) {
    if (cn !== undefined) {
      mainCn.innerHTML = cn;
      mainCn.classList.remove("show");
      void mainCn.offsetWidth;
      mainCn.classList.add("show");
    }
    if (en !== undefined) {
      mainEn.textContent = en;
      mainEn.classList.toggle("show", !!en);
    }
  }

  function setEq(text) {
    if (!text) {
      eqEl.classList.remove("show");
      eqEl.textContent = "";
      return;
    }
    eqEl.textContent = text;
    eqEl.classList.add("show");
  }

  function setSub(html) {
    if (!html) {
      subEl.classList.remove("show");
      subEl.innerHTML = "";
      return;
    }
    subEl.innerHTML = html;
    subEl.classList.add("show");
  }

  function setChapter(text) {
    if (!text) {
      chapterEl.classList.remove("visible");
      chapterEl.innerHTML = "";
      return;
    }
    const parts = text.split(/\s{2,}/);
    chapterEl.innerHTML = parts[0] + (parts[1] ? `<span class="en">${parts[1]}</span>` : "");
    chapterEl.classList.add("visible");
  }

  function setupBits(n) {
    bitRow.innerHTML = "";
    bitStates = [];
    const count = typeof n === "number" ? n : 4;
    for (let i = 0; i < count; i++) {
      const b = document.createElement("div");
      b.className = "bit";
      const val = count === 8 ? [0,1,0,0,0,0,0,1][i] : 0; // 'A' = 65 = 01000001 for demo when 8
      bitStates.push(val);
      b.textContent = String(val);
      if (val) b.classList.add("on");
      b.addEventListener("click", (e) => {
        e.stopPropagation();
        bitStates[i] = 1 - bitStates[i];
        b.textContent = String(bitStates[i]);
        b.classList.toggle("on", !!bitStates[i]);
        sfxClick();
        updateBitLabel();
      });
      bitRow.appendChild(b);
    }
    bitRow.classList.add("show");
    updateBitLabel();
  }

  function updateBitLabel() {
    const bin = bitStates.join("");
    const dec = parseInt(bin || "0", 2);
    let extra = "";
    if (bitStates.length === 8 && dec >= 32 && dec < 127) {
      extra = `  ·  '${String.fromCharCode(dec)}'`;
    }
    bitLabel.textContent = `${bin}₂  =  ${dec}₁₀${extra}`;
    bitLabel.classList.add("show");
  }

  function clearBits() {
    bitRow.classList.remove("show");
    bitLabel.classList.remove("show");
    bitRow.innerHTML = "";
    bitLabel.textContent = "";
  }

  // ─── Beat application ─────────────────────────────────────────────
  function resolveChapter(idx) {
    for (let i = idx; i >= 0; i--) {
      if (beats[i].chapter !== undefined) return beats[i].chapter;
    }
    return "";
  }

  function applyBeat(beat, idx) {
    scene = beat.scene || "idle";
    setChapter(resolveChapter(idx));
    setText(beat.cn || "", beat.en || "");
    setEq(beat.eq || "");
    setSub(beat.sub || "");

    if (beat.bits) {
      setupBits(beat.bits === true ? 4 : beat.bits);
    } else {
      clearBits();
    }

    if (beat.scene === "hook_on" || beat.scene === "callback_on") {
      lampOn = true;
      sfxBass();
    }
    if (beat.scene === "hook_off") {
      lampOn = false;
      sfxClick();
    }
    if (beat.scene === "title" || beat.scene === "byte" || beat.scene === "leibniz") {
      sfxBass();
    }
    if (beat.scene === "noise") {
      noiseFlip = 1;
    }

    if (idx !== spokenIdx && beat.speak) {
      spokenIdx = idx;
      speak(beat.speak, beat.audio || null);
    }
  }

  function findBeatIndex(t) {
    let idx = 0;
    for (let i = 0; i < beats.length; i++) {
      if (beats[i].t <= t) idx = i;
      else break;
    }
    return idx;
  }

  // ─── Render loop ──────────────────────────────────────────────────
  function render(now) {
    if (playing) {
      elapsed = (now - t0) / 1000;
      if (elapsed >= TOTAL) {
        elapsed = TOTAL;
        playing = false;
        stopSpeak();
        stopBgm(true);
        btnPlay.textContent = "▶";
        endcard.classList.add("show");
      }
    }

    const idx = findBeatIndex(elapsed);
    if (idx !== lastBeatIdx) {
      lastBeatIdx = idx;
      applyBeat(beats[idx], idx);
    }

    // progress UI
    const pct = (elapsed / TOTAL) * 100;
    progress.style.width = pct + "%";
    timeLabel.textContent = fmt(elapsed) + " / " + fmt(TOTAL);

    // canvas scene
    clearScene();
    const localT = elapsed;
    const pulse = (Math.sin(localT * 2) + 1) / 2;

    switch (scene) {
      case "hook_on":
        drawLamp(true, pulse);
        break;
      case "hook_blank":
      case "callback_blank":
      case "callback_blank2":
        drawCursorBlank(localT);
        break;
      case "hook_off":
        drawLamp(false, 0);
        break;
      case "hook_two":
        drawLamp(Math.floor(localT * 1.2) % 2 === 0, pulse * 0.5);
        break;
      case "title":
        drawHorizon(H * 0.48, "rgba(110,200,212,0.6)", "rgba(110,200,212,0.3)");
        break;
      case "lamp":
      case "bit_intro":
        drawLamp(lampOn, pulse);
        break;
      case "bit_toggle":
      case "byte":
        // bits are DOM
        break;
      case "place_intro":
        drawHorizon(H * 0.5, "rgba(201,168,106,0.5)");
        break;
      case "powers": {
        const b = beats[idx];
        const p = Math.min(1, (elapsed - b.t) / 6);
        drawPowerTicks(p);
        break;
      }
      case "decode":
        drawBinaryBar([1,0,1,1], Math.floor(localT * 1.5) % 4, false);
        break;
      case "leibniz":
        drawHorizon(H * 0.46, "rgba(110,200,212,0.5)");
        break;
      case "misread":
        break;
      case "noise":
        drawNoiseGlitch(localT);
        drawBinaryBar([1,0,1,1], 2, true);
        break;
      case "redundancy":
      case "ecc":
        drawBinaryBar([1,0,1,1,0,1], -1, false);
        break;
      case "scale_k":
      case "scale_g":
        drawHorizon(H * 0.5, "rgba(201,168,106,0.45)");
        break;
      case "voyager":
        drawVoyager(localT);
        break;
      case "dna":
        drawDNA(localT);
        break;
      case "philosophy":
      case "all_bits":
        drawStars(60, localT * 0.03);
        drawHorizon(H * 0.5, "rgba(110,200,212,0.35)");
        break;
      case "callback_on":
        drawLamp(true, pulse);
        break;
      case "end":
        break;
      default:
        break;
    }

    requestAnimationFrame(render);
  }

  function fmt(s) {
    s = Math.max(0, Math.min(TOTAL, s));
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return m + ":" + String(sec).padStart(2, "0");
  }

  // ─── Playback controls ────────────────────────────────────────────
  function play() {
    if (elapsed >= TOTAL) elapsed = 0;
    t0 = performance.now() - elapsed * 1000;
    playing = true;
    started = true;
    btnPlay.textContent = "❚❚";
    endcard.classList.remove("show");
    controls.classList.add("visible");
    // re-trigger beat (narration gated by ENABLE_NARRATION)
    spokenIdx = -1;
    lastBeatIdx = -1;
    // Must wait for AudioContext.resume() or Safari/Chrome mobile stay silent.
    unlockAudio().then(function () {
      if (!playing) return;
      startAmbient();
      startBgm();
    });
  }

  function pause() {
    playing = false;
    btnPlay.textContent = "▶";
    stopSpeak();
    pauseBgm();
  }

  function toggle() {
    if (!started) return startFilm();
    if (playing) pause();
    else play();
  }

  function seek(sec) {
    elapsed = Math.max(0, Math.min(TOTAL, sec));
    t0 = performance.now() - elapsed * 1000;
    spokenIdx = -1;
    lastBeatIdx = -1;
    stopSpeak();
    endcard.classList.remove("show");
    if (playing) {
      // keep playing
    }
  }

  function replay() {
    elapsed = 0;
    spokenIdx = -1;
    lastBeatIdx = -1;
    stopSpeak();
    endcard.classList.remove("show");
    resetBgmPhase();
    play();
  }

  function startFilm() {
    cover.classList.add("hide");
    setTimeout(() => { cover.style.display = "none"; }, 900);
    // Gesture → unlock audio, audible click proves the graph is live, then play.
    unlockAudio().then(function () {
      sfxClick();
      play();
    });
  }

  // ─── Events ───────────────────────────────────────────────────────
  cover.addEventListener("click", startFilm);
  btnPlay.addEventListener("click", (e) => { e.stopPropagation(); toggle(); });
  btnReplay.addEventListener("click", (e) => { e.stopPropagation(); replay(); });
  $("btn-end-replay").addEventListener("click", replay);

  $("progress-wrap").addEventListener("click", (e) => {
    const rect = e.currentTarget.getBoundingClientRect();
    const ratio = (e.clientX - rect.left) / rect.width;
    seek(ratio * TOTAL);
    if (!playing && started) play();
  });

  // show controls on move
  function bumpControls() {
    controls.classList.add("visible");
    controls.classList.remove("idle");
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => {
      if (playing) controls.classList.add("idle");
    }, 2800);
  }
  window.addEventListener("mousemove", bumpControls);
  window.addEventListener("touchstart", bumpControls, { passive: true });

  // click stage to pause/play (except interactive bits)
  $("stage").addEventListener("click", (e) => {
    if (!started) return;
    if (e.target.closest("#controls") || e.target.closest(".bit") || e.target.closest("#endcard") || e.target.closest("#cover")) return;
    toggle();
    bumpControls();
  });

  // keyboard
  window.addEventListener("keydown", (e) => {
    if (e.code === "Space") { e.preventDefault(); toggle(); }
    if (e.code === "ArrowRight") seek(elapsed + 5);
    if (e.code === "ArrowLeft") seek(elapsed - 5);
    if (e.key === "r" || e.key === "R") replay();
  });

  // Debug ?t=
  const params = new URLSearchParams(location.search);
  if (params.has("t")) {
    cover.classList.add("hide");
    cover.style.display = "none";
    started = true;
    controls.classList.add("visible");
    elapsed = parseFloat(params.get("t")) || 0;
    ensureAudio();
    startAmbient();
    // paused at t for inspection
    playing = false;
    btnPlay.textContent = "▶";
    lastBeatIdx = -1;
    spokenIdx = -1;
    const idx = findBeatIndex(elapsed);
    applyBeat(beats[idx], idx);
    // don't speak on debug load unless playing
    stopSpeak();
  }

  requestAnimationFrame(render);
})();
</script>
</body>
</html>
